name: Pages

# The site is static: site/ plus the two JSON files the daily run commits.
on:
  push:
    branches: [main]
    paths: ["site/**", "data/report.json", "data/products.json", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Collect prices"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # after a collection run, main has the new data
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp site/* _site/
          cp data/report.json data/products.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
